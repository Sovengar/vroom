# mise tasks for testing the vroom picker (t key).
# Requires `mise` installed to RUN them (`mise run <task>`);
# listing them in the picker only parses this file.

[tasks.install]
description = "Install dependencies (simulated)"
run = "echo 'mise: installing web-frontend'"

[tasks.build]
description = "Production build (simulated)"
run = "echo 'mise: building web-frontend'"

[tasks.serve]
description = "Serves the frontend on 5173"
run = "node server.js"

[tasks.internal]
hide = true
run = "echo 'should not appear in the picker'"
