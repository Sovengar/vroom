# .vroom-compose.toml — Stack orchestration for playground
# Each [[stack]] defines a group of services with sequential stages
# and parallel services within each stage.

# Infra: reverse proxy that fronts everything
[[stack]]
name = "infra"
primary_group = "infra"

  [[stack.stage]]
  name = "proxy"
  services = ["nginx-proxy"]
  timeout = "15s"

# Tienda: backend first, frontend after
[[stack]]
name = "tienda"
primary_group = "tienda"

  [[stack.stage]]
  name = "backend"
  services = ["billing-api-go", "orders-api-springboot", "products-api-java"]
  timeout = "30s"

  [[stack.stage]]
  name = "frontend"
  services = ["web-frontend"]
  timeout = "20s"

# Servers: independent APIs in parallel
[[stack]]
name = "servers"
primary_group = "servers"

  [[stack.stage]]
  name = "api"
  services = ["auth-api-go", "search-api-python"]
  timeout = "15s"
