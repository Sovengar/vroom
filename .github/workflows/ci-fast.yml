name: CI fast

# The PER-COMMIT signal; `ci.yml` is the gate. Two workflows on purpose: the gate asks for
# Lint, Test and Mutation on every PR and every push to main, while a commit pushed to a
# feature branch with no PR would otherwise get NO CI at all until the PR is opened.
#
# NOT a required check: `protect-main` requires Lint, Test and Mutation. A red `CI fast`
# never blocks a merge and a green one never authorises one.
#
# The overlap this accepts is deliberate: a branch with an open PR gets this on push AND
# `ci.yml` on pull_request. There is no native way to ask "does this branch have a PR", and
# the cost is a minute of an advisory run.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Its own group, deliberately not `ci`'s: an advisory run must never cancel a required
# one, and a required run must never leave this pending.
concurrency:
  group: cifast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Fast:
    name: CI fast
    runs-on: ubuntu-24.04
    # 10m, not 5: the suite is ~1m15s on a warm machine and the runner is cold, and the
    # fd install below is a download on the first run.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The scanner prefers fd (`fd --hidden`) and its tests assert hidden-dir
      # discovery, but ubuntu runners ship no `fd` (Debian packages it as
      # `fdfind`). Without it the WalkDir fallback runs, which skips hidden dirs,
      # and TestScanFindsVroomTomlInHiddenDirs fails. Provide it for parity with
      # the documented local environment (`make test` assumes fd is present).
      #
      # Instead of `apt-get install fd-find` on every run (apt is the most
      # expensive part of this job and the binary never changes), cache a pinned
      # static musl build of the upstream sharkdp/fd release. The release
      # publishes no checksums asset, so FD_SHA256 below is a self-pinned digest
      # of the exact tarball; a mismatch fails the job loudly. A cache miss pays
      # only a single curl+tar+install. The key includes the fd version plus
      # OS/arch and deliberately omits restore-keys: a versioned tool must never
      # silently fall back to a different version.
      - name: Cache fd binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fd-bin
          key: fd-${{ runner.os }}-${{ runner.arch }}-v10.5.0
      - name: Install fd
        run: |
          set -euo pipefail
          FD_VERSION="v10.5.0"
          FD_ASSET="fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz"
          FD_SHA256="761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
          FD_BIN_DIR="$HOME/.cache/fd-bin"
          FD_BIN="$FD_BIN_DIR/fd"

          if [ "${{ runner.arch }}" != "X64" ]; then
            echo "ERROR: fd asset is pinned for X64 but the runner is ${{ runner.arch }}" >&2
            exit 1
          fi

          if [ -x "$FD_BIN" ]; then
            echo "fd restored from cache ($FD_BIN)"
          else
            echo "fd cache miss; downloading $FD_ASSET"
            mkdir -p "$FD_BIN_DIR"
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/$FD_ASSET" \
              "https://github.com/sharkdp/fd/releases/download/$FD_VERSION/$FD_ASSET"
            actual="$(sha256sum "$tmp/$FD_ASSET" | awk '{print $1}')"
            if [ "$actual" != "$FD_SHA256" ]; then
              echo "ERROR: sha256 mismatch for $FD_ASSET" >&2
              echo "expected: $FD_SHA256" >&2
              echo "actual:   $actual" >&2
              exit 1
            fi
            tar -xzf "$tmp/$FD_ASSET" -C "$tmp"
            install -m 0755 "$tmp/fd-v10.5.0-x86_64-unknown-linux-musl/fd" "$FD_BIN"
            rm -rf "$tmp"
          fi

          # Expose a stable `fd` on PATH for the Test step (the Go tests resolve
          # it via exec.LookPath). Fail loudly if neither cache nor download
          # produced a usable binary, never silently fall back to WalkDir.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$FD_BIN" "$HOME/.local/bin/fd"
          if ! grep -qxF "$HOME/.local/bin" "$GITHUB_PATH" 2>/dev/null; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v fd >/dev/null; then
            echo "ERROR: no usable fd on PATH after cache restore/download" >&2
            exit 1
          fi
          fd --version
      # The explicit compile gate: "does this commit compile" answered before the suite
      # starts, in the job whose whole point is the fastest honest signal.
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
