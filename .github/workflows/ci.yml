name: CI

# No `paths` filters: this runs on every PR and on every push to `main`.
on:
  pull_request:
    # ready_for_review: a draft flipped to ready reports Mutation too.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# A new push cancels the previous run of the same ref; main is exempt.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # The Makefile is part of the cache key: GOLANGCI_LINT_VERSION lives there.
          cache-dependency-path: |
            go.sum
            Makefile
      # Same path as `make lint` locally: golangci-lint v2.13.2 via the Makefile.
      - name: Lint
        run: make lint

  Test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the coverage gate uses `git merge-base <base> HEAD`.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The scanner prefers fd (`fd --hidden`) and its tests assert hidden-dir
      # discovery, but ubuntu runners ship no `fd` (Debian packages it as
      # `fdfind`). Without it the WalkDir fallback runs, which skips hidden dirs,
      # and TestScanFindsVroomTomlInHiddenDirs fails. Provide it for parity with
      # the documented local environment (`make test` assumes fd is present).
      #
      # Instead of `apt-get install fd-find` on every run (apt is the most
      # expensive part of this job and the binary never changes), cache a pinned
      # static musl build of the upstream sharkdp/fd release. The release
      # publishes no checksums asset, so FD_SHA256 below is a self-pinned digest
      # of the exact tarball; a mismatch fails the job loudly. A cache miss pays
      # only a single curl+tar+install. The key includes the fd version plus
      # OS/arch and deliberately omits restore-keys: a versioned tool must never
      # silently fall back to a different version.
      - name: Cache fd binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fd-bin
          key: fd-${{ runner.os }}-${{ runner.arch }}-v10.5.0
      - name: Install fd
        run: |
          set -euo pipefail
          FD_VERSION="v10.5.0"
          FD_ASSET="fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz"
          FD_SHA256="761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
          FD_BIN_DIR="$HOME/.cache/fd-bin"
          FD_BIN="$FD_BIN_DIR/fd"

          if [ "${{ runner.arch }}" != "X64" ]; then
            echo "ERROR: fd asset is pinned for X64 but the runner is ${{ runner.arch }}" >&2
            exit 1
          fi

          if [ -x "$FD_BIN" ]; then
            echo "fd restored from cache ($FD_BIN)"
          else
            echo "fd cache miss; downloading $FD_ASSET"
            mkdir -p "$FD_BIN_DIR"
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/$FD_ASSET" \
              "https://github.com/sharkdp/fd/releases/download/$FD_VERSION/$FD_ASSET"
            actual="$(sha256sum "$tmp/$FD_ASSET" | awk '{print $1}')"
            if [ "$actual" != "$FD_SHA256" ]; then
              echo "ERROR: sha256 mismatch for $FD_ASSET" >&2
              echo "expected: $FD_SHA256" >&2
              echo "actual:   $actual" >&2
              exit 1
            fi
            tar -xzf "$tmp/$FD_ASSET" -C "$tmp"
            install -m 0755 "$tmp/fd-v10.5.0-x86_64-unknown-linux-musl/fd" "$FD_BIN"
            rm -rf "$tmp"
          fi

          # Expose a stable `fd` on PATH for the Test step (the Go tests resolve
          # it via exec.LookPath). Fail loudly if neither cache nor download
          # produced a usable binary, never silently fall back to WalkDir.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$FD_BIN" "$HOME/.local/bin/fd"
          if ! grep -qxF "$HOME/.local/bin" "$GITHUB_PATH" 2>/dev/null; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v fd >/dev/null; then
            echo "ERROR: no usable fd on PATH after cache restore/download" >&2
            exit 1
          fi
          fd --version
      # Same test set as `make test` (`go test -race`, no `-short`, so the
      # internal/process integration tests run) plus an atomic coverage profile
      # and `-count=1`: with the Go build cache restored, a cached `ok` must
      # never mask a failure.
      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      # 100% of the touched lines against the merge-base, total against scripts/coverage-floor.
      - name: Coverage gate
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "::error::no coverage.out (the tests did not produce it)"
            exit 1
          fi
          base="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            base="${{ github.event.pull_request.base.ref || 'main' }}"
          fi
          merge_base="$(git merge-base "$base" HEAD)"
          if [ -z "$merge_base" ]; then
            echo "::error::no merge-base between HEAD and $base"
            exit 1
          fi
          echo "diff against the merge-base $merge_base ($base)"
          scripts/diff-coverage.sh coverage.out "$merge_base" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Real portless, real proxy: the four gated tests in internal/portless are SKIPPED
  # by the Test job, because a runner ships neither the binary nor Node 24 nor a
  # proxy. This job provides all three and runs them with
  # VROOM_PORTLESS_INTEGRATION_STRICT=1, which turns the environment skips ("no
  # portless installed", "the proxy did not open its port") into failures: a green
  # job that silently skipped every integration test would be worse than a red one.
  #
  # portless is an npm package pinned to the version the ADR's MEASURED facts were
  # taken against (0.15.6); `engines: node >=24` is why the runner's own Node is not
  # enough and setup-node is required. Nothing here reaches ~/.portless: every test
  # isolates PORTLESS_STATE_DIR in a temp dir and starts its own proxy on a free port.
  Integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install portless (pinned)
        run: |
          set -euo pipefail
          PORTLESS_VERSION="0.15.6"
          npm install -g "portless@${PORTLESS_VERSION}"
          PORTLESS_BIN="$(command -v portless)"
          got="$("$PORTLESS_BIN" --version)"
          # A silent upgrade would turn a MEASURED fact into an unmeasured one: fail
          # loudly instead of testing against a portless nobody chose.
          if [ "$got" != "$PORTLESS_VERSION" ]; then
            echo "ERROR: expected portless ${PORTLESS_VERSION}, got ${got}" >&2
            exit 1
          fi
          echo "PORTLESS_BIN=$PORTLESS_BIN" >> "$GITHUB_ENV"
          echo "portless ${got} at ${PORTLESS_BIN}"
      # Only this package holds gated tests; the rest of the suite already ran in Test.
      - name: Integration tests against the real portless
        env:
          VROOM_PORTLESS_INTEGRATION: "1"
          VROOM_PORTLESS_INTEGRATION_STRICT: "1"
        run: go test -race -count=1 ./internal/portless/

# -- Mutation ---------------------------------------------------------
# Measured and decided by scripts/mutate.sh; this file carries paths, refs and budget.
# No `needs:` and no `continue-on-error`; the only `if:` is the event gate below.

  Mutation:
    # Only on a non-draft PR; the fail-vs-skip decision lives in scripts/mutate.sh.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: Mutation
    # Always reports; calibration is a step of this job, and a red says how to fix it.
    runs-on: ubuntu-24.04
    # 13m ceiling + 600s reserve < 25m job; scripts/mutate.sh asserts the chain.
    timeout-minutes: 25
    env:
      # Base = merge-base of the branch the PR targets.
      MUTATE_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
      # Budget, mandatory under --ci: mutate.sh refuses to start without it.
      MUTATE_CAP: 180s
      MUTATE_WORKERS: 4
      MUTATE_STALL: 8m
      MUTATE_CEILING: 13m
      MUTATE_JOB_CEILING: 25m
      # Declared setup reserve: checkout, setup-go, suites, base fetch, warm + dry-run.
      MUTATE_SETUP_RESERVE: 600s
    steps:
      # The clock starts before the checkout: the reserve is measured from here.
      - name: Mark the job clock
        run: echo "MUTATE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scope is `git diff <base>...HEAD`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # go.sum and scripts/mutate.sh are part of the cache key.
          cache-dependency-path: |
            go.sum
            scripts/mutate.sh

      # The two suites of the gate: mutate_test.sh and watchdog_test.sh (~1s).
      - name: Shell suites
        run: |
          set -euo pipefail
          bash scripts/watchdog_test.sh
          bash scripts/mutate_test.sh

      # Requires .mutation-allowlist: without it there is nothing to compare survivors with.
      - name: Calibration
        run: |
          set -euo pipefail
          if [ ! -f .mutation-allowlist ]; then
            echo "::error title=Mutation testing not calibrated::.mutation-allowlist is missing, so the gate cannot run and no surviving mutant is being detected. Seed it with: make mutate, then commit .mutation-allowlist"
            exit 1
          fi
          echo "calibrated: $(grep -cvE '^[[:space:]]*(#|$)' .mutation-allowlist) allowlisted mutants"

      # Fetches the base ref even on a shallow clone.
      - name: Resolve mutation scope
        run: |
          set -euo pipefail
          echo "base=$MUTATE_BASE"
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref || github.event.repository.default_branch }}:refs/remotes/origin/${{ github.base_ref || github.event.repository.default_branch }}" || \
            echo "could not fetch base ref; continuing with what is present"

      # One step that measures and decides: the exit code is the verdict.
      - name: Mutate and gate
        id: mutate
        run: |
          scripts/mutate.sh --diff --ci --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.event.pull_request.number || github.run_id }}
          # The report and the run log of the step above.
          path: |
            ${{ steps.mutate.outputs.report }}
            ${{ steps.mutate.outputs.run_log }}
          if-no-files-found: ignore
          retention-days: 14
