name: CI

# NOTE: this workflow intentionally has NO `paths` / `paths-ignore` filters.
# A path-filtered push/PR skips the workflow entirely; a skipped workflow leaves
# its required status checks stuck in "pending" forever, which deadlocks every
# PR that does not touch the filtered paths. The gates run on every change.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a new push ends the previous
# check run. Main is exempt: every commit landing on main gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  Lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Makefile is part of the cache key: GOLANGCI_LINT_VERSION lives there,
          # so bumping the linter busts the cached modules instead of reusing stale ones.
          cache-dependency-path: |
            go.sum
            Makefile
      # Exact `make lint` parity: same pinned golangci-lint v2.13.2 as local,
      # invoked through the repo Makefile (no .golangci.yml exists -> default linter set).
      - name: Lint
        run: make lint

  Test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The scanner prefers fd (`fd --hidden`) and its tests assert hidden-dir
      # discovery, but ubuntu runners ship no `fd` (Debian packages it as
      # `fdfind`). Without it the WalkDir fallback runs, which skips hidden dirs,
      # and TestScanFindsVroomTomlInHiddenDirs fails. Provide it for parity with
      # the documented local environment (`make test` assumes fd is present).
      #
      # Instead of `apt-get install fd-find` on every run (apt is the most
      # expensive part of this job and the binary never changes), cache a pinned
      # static musl build of the upstream sharkdp/fd release. The release
      # publishes no checksums asset, so FD_SHA256 below is a self-pinned digest
      # of the exact tarball; a mismatch fails the job loudly. A cache miss pays
      # only a single curl+tar+install. The key includes the fd version plus
      # OS/arch and deliberately omits restore-keys: a versioned tool must never
      # silently fall back to a different version.
      - name: Cache fd binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fd-bin
          key: fd-${{ runner.os }}-${{ runner.arch }}-v10.5.0
      - name: Install fd
        run: |
          set -euo pipefail
          FD_VERSION="v10.5.0"
          FD_ASSET="fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz"
          FD_SHA256="761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
          FD_BIN_DIR="$HOME/.cache/fd-bin"
          FD_BIN="$FD_BIN_DIR/fd"

          if [ "${{ runner.arch }}" != "X64" ]; then
            echo "ERROR: fd asset is pinned for X64 but the runner is ${{ runner.arch }}" >&2
            exit 1
          fi

          if [ -x "$FD_BIN" ]; then
            echo "fd restored from cache ($FD_BIN)"
          else
            echo "fd cache miss; downloading $FD_ASSET"
            mkdir -p "$FD_BIN_DIR"
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/$FD_ASSET" \
              "https://github.com/sharkdp/fd/releases/download/$FD_VERSION/$FD_ASSET"
            actual="$(sha256sum "$tmp/$FD_ASSET" | awk '{print $1}')"
            if [ "$actual" != "$FD_SHA256" ]; then
              echo "ERROR: sha256 mismatch for $FD_ASSET" >&2
              echo "expected: $FD_SHA256" >&2
              echo "actual:   $actual" >&2
              exit 1
            fi
            tar -xzf "$tmp/$FD_ASSET" -C "$tmp"
            install -m 0755 "$tmp/fd-v10.5.0-x86_64-unknown-linux-musl/fd" "$FD_BIN"
            rm -rf "$tmp"
          fi

          # Expose a stable `fd` on PATH for the Test step (the Go tests resolve
          # it via exec.LookPath). Fail loudly if neither cache nor download
          # produced a usable binary, never silently fall back to WalkDir.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$FD_BIN" "$HOME/.local/bin/fd"
          if ! grep -qxF "$HOME/.local/bin" "$GITHUB_PATH" 2>/dev/null; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v fd >/dev/null; then
            echo "ERROR: no usable fd on PATH after cache restore/download" >&2
            exit 1
          fi
          fd --version
      # Same test set as `make test` (`go test -race`, no `-short`, so the
      # internal/process integration tests run) plus an atomic coverage profile
      # and `-count=1`: with the Go build cache restored, a cached `ok` must
      # never mask a failure.
      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "coverage.out not produced (tests failed before it was written)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | tail -n1 | awk '{print $3}')
          {
            echo "## Test coverage"
            echo ""
            echo "**Total: ${total}**"
            echo ""
            echo "| Package | Coverage |"
            echo "| --- | --- |"
            awk 'NR > 1 {
              split($1, a, ":"); f = a[1];
              n = split(f, p, "/"); pkg = "";
              for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") p[i];
              tot[pkg] += $2;
              if ($3 + 0 > 0) cov[pkg] += $2;
            }
            END {
              for (k in tot) printf "| %s | %.1f%% |\n", k, (tot[k] > 0 ? 100 * cov[k] / tot[k] : 0);
            }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
