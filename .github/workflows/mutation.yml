name: Mutation

# Advisory mutation testing via gremlins. Deliberately has NO `paths` filters and is
# deliberately NOT a required status check: a path-filtered workflow that ever becomes
# required leaves its check stuck in "pending" on every PR that skips it, which
# deadlocks those PRs. The .go scope is enforced INSIDE the job instead, mirroring the
# guard in `make mutate-diff`.
on:
  pull_request:
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a new push ends the previous run.
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Mutation:
    name: Mutation (advisory)
    runs-on: ubuntu-24.04
    # Hard cap. gremlins is never signalled: on SIGTERM it panics
    # ("send on closed channel") and writes no report.json, so a timeout can only
    # mean "no result", never a wrong one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base ref exists for `git diff <base>...HEAD`
          # and for `gremlins --diff <base>`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Makefile is part of the cache key: MUTATE_BASE and the tool wiring live
          # there, so changing them busts stale module caches.
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Resolve mutation scope
        id: scope
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "base=$BASE"
          # Belt and braces: guarantee the base ref is fetched even on shallow setups.
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || \
            echo "could not fetch base ref $BASE_BRANCH; continuing with what is present"
          if git diff --name-only "$BASE...HEAD" | grep -q '\.go$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$BASE...HEAD" | grep '\.go$' | sed 's/^/  changed: /'
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no .go changes vs $BASE - nothing to mutate"
          fi

      - name: Mutate (advisory, never fails the PR)
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: make mutate-diff MUTATE_BASE=origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo "### Mutation testing (advisory)"
            if [ -f report.json ]; then
              jq -r '"- total mutants: \(.mutants_total)\n- killed: \(.mutants_killed)\n- **lived (no test caught them)**: \(.mutants_lived)\n- not covered: \(.mutants_not_covered)\n- not viable: \(.mutants_not_viable)\n- test efficacy: \(.test_efficacy)%\n- mutator coverage: \(.mutations_coverage)%\n- elapsed: \(.elapsed_time)s"' report.json || echo "- could not parse report.json"
            else
              echo "- no report.json produced (timed out, or gremlins was interrupted)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.event.pull_request.number || github.run_id }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 14
